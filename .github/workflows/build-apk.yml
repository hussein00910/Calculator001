name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |What went wrong|Caused by|FAILED|error:|Could not" -A3 build.log | head -c 3500 | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
