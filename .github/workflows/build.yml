name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by Android SDK build tools) ──────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Python 3.11 ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Cache Buildozer global directory ───────────────────────────────
      #    Contains: downloaded Android SDK, NDK, and compiled Python recipes.
      #    First build: ~40-60 min.  Cached builds: ~5-10 min.
      - name: Cache Buildozer environment
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # ── 5. System packages required by Buildozer and Python extensions ─────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential git unzip zip \
            python3-dev libffi-dev \
            libxml2-dev libxslt-dev \
            libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev \
            zlib1g-dev libltdl-dev \
            autoconf libtool pkg-config

      # ── 6. Install Buildozer and Cython ───────────────────────────────────
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # ── 7. Build the debug APK ────────────────────────────────────────────
      - name: Build Debug APK
        run: buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: '0'

      # ── 8. Upload APK artifact ────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Scraper-Android-App
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      # ── 9. Summary ────────────────────────────────────────────────────────
      - name: Print summary
        run: |
          echo "============================================"
          echo "  Build complete!"
          echo "  Download APK from the Artifacts section."
          echo "============================================"
          ls -lh bin/*.apk
